:root{

  --lime:#2d7a1c; --lime-hi:#3aaa22; --lime-bg:#f1faf0; --lime-border:#88cc78;
  --gold-hi:#e8b800;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text-body); font-family:'Inter',sans-serif;
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:24px; text-align:center;
}
.wrap{max-width:480px;}
.eyebrow{
  font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:600;
  letter-spacing:.22em; text-transform:uppercase; color:var(--lime);
  margin-bottom:18px; display:block;
}
.stray-ball{font-size:2.6rem; margin-bottom:8px; line-height:1;}
h1{
  font-family:'Playfair Display',serif; font-weight:900; color:var(--text-primary);
  font-size:clamp(1.8rem,7vw,2.6rem); line-height:1.15; margin-bottom:14px;
}
h1 em{color:var(--gold-hi); font-style:italic;}
p{font-size:15px; line-height:1.65; color:var(--text-muted); margin-bottom:28px;}
.actions{display:flex; flex-wrap:wrap; gap:12px; justify-content:center;}
.btn{
  font-family:'Inter',sans-serif; font-weight:600; font-size:14px;
  padding:13px 24px; border-radius:8px; text-decoration:none;
  transition:transform .15s, border-color .15s;
}
.btn:hover{transform:translateY(-1px);}
.btn-primary{background:var(--lime); color:#ffffff;}
.btn-primary:hover{background:var(--lime-hi);}
.btn-secondary{background:var(--surface); color:var(--text-primary); border:1px solid var(--border);}
.btn-secondary:hover{border-color:var(--lime-border);}

<script>
/* tier-init */
const TIER = 'standard'; // 'standard' | 'pro' | 'elite' — set by patch_playbooks.py
(function() {
  document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('[data-tier]').forEach(function(el) {
      var t = el.getAttribute('data-tier');
      if (t === 'pro'   && TIER === 'standard') { el.remove(); return; }
      if (t === 'elite' && TIER !== 'elite')    { el.remove(); return; }
      // Element is visible for this tier — mark it active for styling
      el.setAttribute('data-tier-active', t);
    });
  });
})();
</script>
<!-- tsp:pwa -->
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a160a">
<script>
(function(){
  if (!("serviceWorker" in navigator)) return;
  // file:// has no service-worker support at all — Pro/Elite buyers open
  // the zip locally, so bail out quietly rather than throwing on load.
  if (location.protocol === "file:") return;
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(e){
      console.warn("[TSP] service worker registration failed:", e);
    });
  });
})();
</script>
